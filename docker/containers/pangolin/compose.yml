########################### NETWORKS
networks:
  default:
    driver: bridge
    name: pangolin_frontend
  socket-proxy-crowdsec-manager:
    external: true

########################### VOLUMES
volumes:
  crowdsec-db:
  crowdsec-config:

########################### SERVICES
name: pangolin
services:
  pangolin:
    container_name: pangolin
    image: docker.io/fosrl/pangolin:ee-1.21.1
    restart: always
    volumes:
      - ./appdata/config:/app/config
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/v1/"]
      interval: "10s"
      timeout: "10s"
      retries: 15
    deploy:
      resources:
        reservations:
          memory: 512m

  gerbil:
    container_name: gerbil
    image: docker.io/fosrl/gerbil:1.4.3
    restart: always
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    ports:
      - 51820:51820/udp
      - 21820:21820/udp
      - 443:443
      - 443:443/udp # For http3 QUIC if desired
      - 80:80
    volumes:
      - ./appdata/config:/var/config
    command:
      - --reachableAt=http://gerbil:3004
      - --generateAndSaveKeyTo=/var/config/key
      - --remoteConfig=http://pangolin:3001/api/v1/
    depends_on:
      pangolin:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          memory: 512m

  traefik:
    container_name: traefik
    image: docker.io/traefik:v3.7
    restart: always
    network_mode: service:gerbil # Ports appear on the gerbil service
    volumes:
      - ./appdata/config/traefik:/etc/traefik # Volume to store the Traefik configuration
      - ./appdata/config/letsencrypt:/letsencrypt # Volume to store the Let's Encrypt certificates
      - ./appdata/config/traefik/logs:/var/log/traefik # Volume to store Traefik logs
    environment:
      CLOUDFLARE_DNS_API_TOKEN: ${CLOUDFLARE_DNS_API_TOKEN}
    command:
      - --configFile=/etc/traefik/traefik_config.yml
    depends_on:
      pangolin:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          memory: 512m

  crowdsec:
    container_name: crowdsec
    image: docker.io/crowdsecurity/crowdsec:latest-debian
    restart: always
    networks:
      default:
#    ports:
#      - 6060:6060
    volumes:
      - ./appdata/config/crowdsec/acquis.yaml:/etc/crowdsec/acquis.yaml:ro
      - crowdsec-db:/var/lib/crowdsec/data
      - crowdsec-config:/etc/crowdsec
      - ./appdata/config/traefik/logs:/var/log/traefik:ro
      - /var/log/journal:/var/log/host:ro
    environment:
      COLLECTIONS: crowdsecurity/traefik crowdsecurity/appsec-virtual-patching crowdsecurity/appsec-generic-rules crowdsecurity/linux crowdsecurity/iptables
      ENROLL_INSTANCE_NAME: pangolin-crowdsec
      ENROLL_TAGS: docker
      GID: "1000"
      PARSERS: crowdsecurity/whitelists
    command: -t
    labels:
      - traefik.enable=false
    healthcheck:
      interval: 10s
      retries: 3
      start_period: 30s
      test:
        - CMD
        - cscli
        - lapi
        - status
      timeout: 5s
    deploy:
      resources:
        reservations:
          memory: 512m

  crowdsec-manager:
    container_name: crowdsec-manager
    image: hhftechnology/crowdsec-manager:latest
    restart: always
    networks:
      default:
      socket-proxy-crowdsec-manager:
    volumes:
#      - /var/run/docker.sock:/var/run/docker.sock
      - ./appdata/config:/app/config # pangolin config folder
      - ./compose.yaml:/app/docker-compose.yml # pangolin compose yml
      - ./appdata/crowdsec-manager/logs:/app/logs
      - ./appdata/config/traefik/logs:/var/log/traefik:ro
      - ./appdata/crowdsec-manager/backups:/app/backups
      - ./appdata/crowdsec-manager/data:/app/data
      # Optional GeoIP database for enriched dashboard location data
      - ./appdata/geoip/GeoLite2-City.mmdb:/app/geoip/GeoLite2-City.mmdb:ro
    environment:
      - PORT=8080
      - ENVIRONMENT=production
      - TRAEFIK_CONTAINER_NAME=traefik
      - CROWDSEC_METRICS_URL=http://crowdsec:6060/metrics
      - ALERT_LIST_LIMIT=5000
      - DOCKER_HOST=tcp://socket-proxy-crowdsec-manager:2375

      - LOG_LEVEL=info
      - LOG_FILE=/app/logs/crowdsec-manager.log
      - COMPOSE_FILE=/app/docker-compose.yml
      - PANGOLIN_DIR=/app
      - CONFIG_DIR=/app/config
      - DATABASE_PATH=/app/data/settings.db
      - TRAEFIK_DYNAMIC_CONFIG=/etc/traefik/dynamic_config.yml
      - TRAEFIK_STATIC_CONFIG=/etc/traefik/traefik_config.yml
      - TRAEFIK_ACCESS_LOG=/var/log/traefik/access.log
      - TRAEFIK_ERROR_LOG=/var/log/traefik/traefik.log
      - CROWDSEC_ACQUIS_FILE=/etc/crowdsec/acquis.yaml
      - BACKUP_DIR=/app/backups
      - RETENTION_DAYS=60
      - INCLUDE_CROWDSEC=true
    depends_on:
      crowdsec:
        condition: service_healthy
      traefik:
        condition: service_started
    deploy:
      resources:
        reservations:
          memory: 512m
